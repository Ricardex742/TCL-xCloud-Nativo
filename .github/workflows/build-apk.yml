name: Compilar APK Android 10 e TV

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar código do repositório
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK e Gradle
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TEMP/apk-tools"
          mkdir -p "$tool_root/android-sdk/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip -o "$tool_root/android-tools.zip"
          echo "e025545c62a8e64c7559119566a569fb1dec5f60  $tool_root/android-tools.zip" | sha1sum -c -
          unzip -q "$tool_root/android-tools.zip" -d "$tool_root/android-sdk/cmdline-tools"
          mv "$tool_root/android-sdk/cmdline-tools/cmdline-tools" "$tool_root/android-sdk/cmdline-tools/latest"
          export ANDROID_HOME="$tool_root/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'
          curl -fsSL https://downloads.gradle.org/distributions/gradle-8.7-bin.zip -o "$tool_root/gradle.zip"
          echo "544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d  $tool_root/gradle.zip" | sha256sum -c -
          unzip -q "$tool_root/gradle.zip" -d "$tool_root"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$tool_root/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Compilar APK e verificar APIs para Android 10
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/android.init.gradle" <<'INIT'
          beforeSettings { settings ->
              settings.pluginManagement.resolutionStrategy.eachPlugin {
                  if (requested.id.id == "com.android.application" && requested.version == null) useVersion("8.5.2")
                  if (requested.id.id == "org.jetbrains.kotlin.android" && requested.version == null) useVersion("1.9.24")
              }
          }
          gradle.beforeProject { project ->
              if (project.path == ":app") {
                  project.plugins.withId("com.android.application") {
                      project.extensions.getByName("androidComponents").finalizeDsl { androidDsl ->
                          androidDsl.lint.checkOnly.addAll(["NewApi", "InlinedApi"])
                      }
                  }
              }
          }
          INIT
          gradle -I "$RUNNER_TEMP/android.init.gradle" -Pandroid.useAndroidX=true --no-daemon --max-workers=2 :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
          python3 - <<'PYTEST'
          from pathlib import Path
          import os, xml.etree.ElementTree as E
          suites = [E.parse(p).getroot() for p in Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          totals = {key: sum(int(s.get(key, 0)) for s in suites) for key in ('tests', 'failures', 'errors', 'skipped')}
          assert totals['tests'] > 0 and totals['failures'] == 0 and totals['errors'] == 0, totals
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Testes JVM: {totals}\n")
          print(totals)
          PYTEST
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep -Fx "sdkVersion:'29'"

      - name: Salvar o APK gerado para download
        uses: actions/upload-artifact@v4
        with:
          name: TCL-xCloud-App-Debug-Android10
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Salvar resultados dos testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-client-test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/lint-results-debug.*
