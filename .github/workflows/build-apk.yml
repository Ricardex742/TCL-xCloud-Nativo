name: Compilar APK Android TV

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 1. Copiar código do repositório
      uses: actions/checkout@v4

    - name: 2. Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: 3. Configurar Android SDK
      uses: android-actions/setup-android@v3

    - name: 4. Configurar Gradle 8.5 Exato (Evita erro de Wrapper ausente)
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: 5. Compilar Debug APK com Gradle
      run: gradle assembleDebug --stacktrace

    - name: 6. Salvar o APK gerado para download
      uses: actions/upload-artifact@v4
      with:
        name: TCL-xCloud-App-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
