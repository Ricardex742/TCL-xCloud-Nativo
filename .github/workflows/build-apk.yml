name: Compilar APK Android TV

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Copiar código do repositório
      uses: actions/checkout@v4

    - name: Configurar JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Configurar Android SDK
      uses: android-actions/setup-android@v3

    - name: Dar permissão de execução ao Gradle
      run: chmod +x gradlew || true

    - name: Compilar Debug APK com Gradle
      run: ./gradlew assembleDebug || gradle assembleDebug

    - name: Salvar o APK gerado para download
      uses: actions/upload-artifact@v4
      with:
        name: TCL-xCloud-App-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
