name: Compilar APK Android 10 e TV

on:
  push:
    branches: [ "main", "ci/apk-android10-3cc2595", "perf/decoder-display-latency-0.31" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/ci/apk-android10-3cc2595' || github.ref == 'refs/heads/perf/decoder-display-latency-0.31'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Copiar código do repositório
        uses: actions/checkout@v5

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Configurar Android SDK e Gradle
        shell: bash
        run: |
          set -euo pipefail
          tool_root="$RUNNER_TEMP/apk-tools"
          mkdir -p "$tool_root/android-sdk/cmdline-tools"
          curl -fsSL https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip -o "$tool_root/android-tools.zip"
          echo "e025545c62a8e64c7559119566a569fb1dec5f60  $tool_root/android-tools.zip" | sha1sum -c -
          unzip -q "$tool_root/android-tools.zip" -d "$tool_root/android-sdk/cmdline-tools"
          mv "$tool_root/android-sdk/cmdline-tools/cmdline-tools" "$tool_root/android-sdk/cmdline-tools/latest"
          export ANDROID_HOME="$tool_root/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" 'platform-tools' 'platforms;android-34' 'build-tools;34.0.0'
          curl -fsSL https://downloads.gradle.org/distributions/gradle-8.7-bin.zip -o "$tool_root/gradle.zip"
          echo "544c35d6bd849ae8a5ed0bcea39ba677dc40f49df7d1835561582da2009b961d  $tool_root/gradle.zip" | sha256sum -c -
          unzip -q "$tool_root/gradle.zip" -d "$tool_root"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$tool_root/gradle-8.7/bin" >> "$GITHUB_PATH"

      - name: Validar proteção da assinatura
        shell: bash
        run: python3 -m unittest discover -s scripts/tests -v

      - name: Verificar idiomas e campos das traduções
        shell: bash
        run: python3 scripts/verify_translations.py

      - name: Preparar assinatura fixa do aplicativo
        env:
          XCLOUD_ANDROID_KEYSTORE_BASE64: ${{ secrets.XCLOUD_ANDROID_KEYSTORE_BASE64 }}
        shell: bash
        run: python3 scripts/prepare_signing.py

      - name: Compilar APK e verificar APIs para Android 10
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --max-workers=2 --stacktrace :app:testDebugUnitTest :app:assembleDebug :app:lintDebug
          python3 - <<'PYTEST'
          from pathlib import Path
          import os, xml.etree.ElementTree as E
          suites = [E.parse(p).getroot() for p in Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          totals = {key: sum(int(s.get(key, 0)) for s in suites) for key in ('tests', 'failures', 'errors', 'skipped')}
          assert totals['tests'] > 0 and totals['failures'] == 0 and totals['errors'] == 0 and totals['skipped'] == 0, totals
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f"Testes JVM: {totals}\n")
          print(totals)
          PYTEST
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --verbose "$apk"
          python3 scripts/verify_apk_signing.py "$apk"
          badging=$("$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$apk")
          printf '%s\n' "$badging" | grep -F "package: name='com.xcloud.tclnative'"
          printf '%s\n' "$badging" | grep -Fx "sdkVersion:'24'"
          sha256sum "$apk" | tee "$apk.sha256"
          {
            echo '### APK debug gerado'
            echo "- Branch: $GITHUB_REF_NAME"
            echo '- Android mínimo: 7.0 (API 24), incluindo Android 10 (API 29).'
            echo '- Assinatura e lint NewApi/InlinedApi verificados.'
            echo '- Testes JVM de autenticação, provisionamento e protocolo executados.'
            echo '- Baixe o artefato TCL-xCloud-App-Debug-Android10 abaixo.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Verificar filtros e reconstrução com GPU por software
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libegl1 libegl-mesa0 libgl1-mesa-dri ffmpeg
          python3 scripts/verify_image_filter.py
          python3 scripts/verify_fsr1.py
          python3 scripts/verify_image_treatment.py
          python3 scripts/verify_reconstruction.py
          cat app/build/reports/dashboard/image-filter-validation.txt >> "$GITHUB_STEP_SUMMARY"
          cat app/build/reports/dashboard/fsr1-validation.txt >> "$GITHUB_STEP_SUMMARY"
          cat app/build/reports/dashboard/image-treatment-validation.txt >> "$GITHUB_STEP_SUMMARY"
          cat app/build/reports/reconstruction/quality.json >> "$GITHUB_STEP_SUMMARY"

      - name: Salvar o APK gerado para download
        uses: actions/upload-artifact@v4
        with:
          name: TCL-xCloud-App-Debug-Android10
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
            app/build/outputs/apk/debug/app-debug.apk.metadata.json
          if-no-files-found: error

      - name: Salvar relatório de compatibilidade de APIs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-api-lint-results
          path: |
            app/build/reports/lint-results-debug.*
            app/build/test-results/testDebugUnitTest/
            app/build/reports/dashboard/
            app/build/reports/huds/
            app/build/reports/reconstruction/
            app/build/reports/themes/
